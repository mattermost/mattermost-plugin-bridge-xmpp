server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Openfire's websocket endpoint. Proxying it here keeps the browser on a single
    # origin, so Openfire needs no extra published ports and no CORS configuration.
    location /xmpp-websocket {
        proxy_pass http://openfire:7070/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Must never be cached, or the browser keeps the stale worker it is meant to evict.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # No SPA fallback. Converse is a single page with no client-side routes, and a
    # catch-all would answer requests for missing .js files with HTML, which the
    # browser then fails to parse as a script.
    location / {
        try_files $uri $uri/ =404;
    }
}
